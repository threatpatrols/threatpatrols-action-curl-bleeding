  api:
    credentials:
      # Bearer Token: credential01example.test-secret-CHANGE-ME-PLEASE-alphanumeric
      credential01example:  # NB: this 'credential01example' key-name is hardcoded to terminate when non-debug mode.
        secret: test-secret-CHANGE-ME-PLEASE-alphanumeric
        tags:
          comment: "User 12345 from the Foo system"
          other_data: "This is a free-form tag value"
          other_system_name: foo
          other_system_user_id: 12345

  state:
    method: "filesystem"
    params:
      root_path: "/tmp/tpas"
    calls:
      ttl_seconds: 7200
    tasks:
      ttl_seconds: 7200
