
action:

  callbacks:

    http:
      http01example:
        method: POST
        url: https://httpbin.org/anything/test-example-post
        headers:
          Authentication: "Bearer ${VALUE_FROM_ENV}"
        verify: false
        send: summary
      http02example:
        method: GET
        url: https://httpbin.org/anything/test-example-get/?action-name={action_name}&call-id={call_id}

    s3put:
      s3put01example:
        url: s3://threatpatrols-c93f37e6/testing/{action_name}/{call_id_prefix}/{call_id}.summary
        send: summary
      s3put02example:
        url: s3://threatpatrols-c93f37e6/testing/{action_name}/{call_id_prefix}/{call_id}.output
        send: output
      s3put03example:
        url: s3://threatpatrols-c93f37e6/testing/{action_name}/{call_id_prefix}/{call_id}.input
        send: input

    slack:
      slack01example:
        token: "${SLACK_BOT_TOKEN}"
        channel: "C082F69DBD2"
        message: |
          *{tag.action_title}*
           - *url*: `{url}`
           - *status_code*: {status_code}
           - *nodename*: {tag.platform_node}
           - *call_id*: {tag.call_id}
           - *task_id*: {tag.task_id}
        send: summary


